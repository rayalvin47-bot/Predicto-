<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predicto</title>
  <style>
    :root { --bg: linear-gradient(135deg, #0d0415, #05010a); --accent: #8b5cf6; --border: 1px solid #3b2a56; }
    body { margin: 0; background: var(--bg); color: #f3e8ff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .container { width: 90%; max-width: 400px; padding: 20px; border: var(--border); background: #0c0517; text-align: center; }
    .slide { display: none; } .active { display: block; }
    .btn { background: var(--accent); color: #fff; border: none; padding: 12px; width: 100%; margin-top: 10px; font-weight: bold; cursor: pointer; }
    input { background: #0d0415; border: var(--border); color: #fff; width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Auth Screen -->
    <div id="auth" class="slide active">
      <h2>🔮 Predicto Login</h2>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="pass" placeholder="Password">
      <button class="btn" onclick="authAction('up')">Sign Up</button>
      <button class="btn" onclick="authAction('in')">Log In</button>
    </div>
    <!-- Main Screen -->
    <div id="home" class="slide">
      <h2>🔮 Ask Predicto</h2>
      <input type="text" id="q" placeholder="What is your decision?">
      <button class="btn" onclick="ask()">Ask AI</button>
    </div>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const config = { projectId: "predicto-b2c51", appId: "940357674989" };
    const app = initializeApp(config);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.authAction = async (type) => {
      const e = document.getElementById('email').value, p = document.getElementById('pass').value;
      try {
        if (type === 'up') await createUserWithEmailAndPassword(auth, e, p);
        else await signInWithEmailAndPassword(auth, e, p);
        document.getElementById('auth').classList.remove('active');
        document.getElementById('home').classList.add('active');
      } catch (err) { alert(err.message); }
    };

    window.ask = async () => {
      const q = document.getElementById('q').value;
      try {
        await addDoc(collection(db, "queries"), { text: q, userId: auth.currentUser.uid, date: new Date() });
        alert("Saved to Firestore! Next up: configuring the AI proxy.");
      } catch (err) { alert(err.message); }
    };
  </script>
</body>
</html>
